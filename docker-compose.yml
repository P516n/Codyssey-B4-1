services:
  ubuntu-lab:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubuntu-lab
    privileged: true
    cgroup: host
    volumes:
      - /sys/fs/cgroup:/sys/fs/cgroup:rw
      - .:/workspace
    ports:
      - "20022:20022"
      - "15034:15034"
    restart: unless-stopped